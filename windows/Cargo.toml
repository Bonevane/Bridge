[package]
name = "bridge-windows"
version = "0.3.3"
edition = "2021"
description = "Bridge for Windows and Linux: your Android phone on your PC"
license = "Apache-2.0"

[[bin]]
name = "Bridge"
path = "src/main.rs"

[dependencies]
# The pairing handshake (HMAC-SHA256), same as the phone and the Mac.
hmac = "0.12"
sha2 = "0.10"
# App-layer encryption on the plain Bluetooth door (no bond needed).
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"
# Clipboard text, both directions.
arboard = { version = "3", features = ["wayland-data-control"] }
# Windows toast notifications without a Start Menu shortcut dance.
# The window, in Windows' own Fluent style.
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "unstable-winit-030"] }
# Audio: AAC decoding in pure Rust, output through WASAPI (ALSA on Linux).
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
cpal = "0.15"
# Small conveniences.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1"
# Updates (updater.rs): the JSON from GitHub and the release zip.
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
# Microsoft's own bindings. Only the namespaces we touch, to keep the build small.
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Radios",
    "Devices_Enumeration",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "UI_Notifications",
    "Data_Xml_Dom",
] }
# Tray icon and its menu.
tray-icon = "0.19"
# HTTPS with Windows' own TLS (SChannel) rather than rustls/ring: no C code to
# build, and it trusts what Windows trusts (corporate proxies included).
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# BlueZ, the Linux Bluetooth stack, over D-Bus.
bluer = { version = "0.17", features = ["bluetoothd"] }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
futures = "0.3"
# Tray icon as a StatusNotifierItem: plain D-Bus, so no GTK to depend on.
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }
# Desktop notifications (replies and dismissals need the raw interface).
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
# H.264 in software, built into the binary: nothing for the user to install.
openh264 = "0.8"
# The desktop's keyring for the pairing secret.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
# rustls rather than the system OpenSSL, whose version differs between distros.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
